name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test & Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Swift 6+ toolchain
        run: |
          if ! swift --version | grep -qE "Swift version [6-9]\."; then
            NEWEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$NEWEST_XCODE" ]]; then
              sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
            fi
          fi
          swift --version

      - name: Run unit tests
        run: swift run MarkaTests

      - name: Build Marka.app
        run: ./scripts/build-app.sh release

      - name: Package DMG & ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: UNIVERSAL=1 ./scripts/package-dmg.sh

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Marka-macos
          path: |
            build/Marka.app
            build/Marka.dmg
            build/Marka-macos.zip
            build/SHA256SUMS.txt
